name: Trigger Portfolio Rebuild

on:
  push:
    branches:
      - main
    paths:
      - 'chapters/**'
      - 'README.md'

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger portfolio website rebuild
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.PORTFOLIO_REBUILD_TOKEN }}" \
            https://api.github.com/repos/saint1729/saint1729.github.io/dispatches \
            -d '{"event_type":"book-content-updated"}'
